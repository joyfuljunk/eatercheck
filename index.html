<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식습관 다이어리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 antialiased selection:bg-rose-500 selection:text-white">

  <!-- Main Container -->
  <div class="max-w-md mx-auto px-4 py-6">
    
    <!-- Header -->
    <header class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <i data-lucide="utensils-crossed" class="w-7 h-7 text-rose-500"></i>
          식습관 다이어리
        </h1>
        <p class="text-xs text-slate-500 mt-1">자주 먹으면 안 되는 음식의 권장 섭취 주기를 관리해보세요.</p>
      </div>
    </header>

    <!-- Quick Stats Summary -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-white border border-slate-200/80 p-3.5 rounded-2xl flex items-center gap-3 shadow-sm">
        <div class="p-2.5 bg-rose-50 text-rose-500 rounded-xl">
          <i data-lucide="timer" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">대기 중인 음식</div>
          <div id="stat-waiting" class="text-lg font-bold text-slate-800">0개</div>
        </div>
      </div>

      <div class="bg-white border border-slate-200/80 p-3.5 rounded-2xl flex items-center gap-3 shadow-sm">
        <div class="p-2.5 bg-emerald-50 text-emerald-500 rounded-xl">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">먹어도 되는 음식</div>
          <div id="stat-ready" class="text-lg font-bold text-slate-800">0개</div>
        </div>
      </div>
    </div>

    <!-- Form Section (Add New Food) -->
    <section class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm mb-6">
      <h2 id="form-title" class="text-sm font-semibold text-slate-800 mb-3 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-rose-500"></i>
        새 제한 음식 등록
      </h2>
      <form id="food-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="editing-id" value="">
        
        <div>
          <label for="food-name" class="block text-xs font-medium text-slate-500 mb-1">음식 이름</label>
          <input 
            type="text" 
            id="food-name" 
            placeholder="예: 라면, 칼국수, 치킨, 햄버거" 
            required 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-1 focus:ring-rose-500 transition"
          />
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="cooldown-days" class="block text-xs font-medium text-slate-500 mb-1">권장 휴식 간격(일)</label>
            <input 
              type="number" 
              id="cooldown-days" 
              placeholder="7" 
              min="1" 
              max="365" 
              required 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-1 focus:ring-rose-500 transition"
            />
          </div>
          <div>
            <label for="food-category" class="block text-xs font-medium text-slate-500 mb-1">카테고리</label>
            <select 
              id="food-category"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-1 focus:ring-rose-500 transition"
            >
              <option value="🍜 면류/밀가루">🍜 면류/밀가루</option>
              <option value="🍔 인스턴트">🍔 인스턴트</option>
              <option value="🍕 자극적/야식">🍕 자극적/야식</option>
              <option value="🧋 디저트/당류">🧋 디저트/당류</option>
              <option value="🍺 음주/고칼로리">🍺 음주/고칼로리</option>
              <option value="🍲 기타">🍲 기타</option>
            </select>
          </div>
        </div>

        <div class="flex gap-2">
          <button 
            type="button" 
            id="cancel-edit-btn"
            onclick="resetForm()" 
            class="hidden w-1/3 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-xl transition duration-150"
          >
            취소
          </button>
          <button 
            type="submit" 
            id="submit-btn"
            class="flex-1 py-2.5 px-4 bg-rose-500 hover:bg-rose-600 text-white text-sm font-semibold rounded-xl shadow-sm shadow-rose-500/30 active:scale-[0.98] transition duration-150 flex items-center justify-center gap-2"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span id="submit-btn-text">음식 목록에 추가하기</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Food List Section -->
    <section class="space-y-3">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-sm font-semibold text-slate-700">내 관리 목록</h2>
        <div class="flex items-center gap-2">
          <!-- Status Filter -->
          <select id="status-filter" onchange="renderUI()" class="text-xs bg-white border border-slate-200 rounded-lg px-2 py-1 text-slate-600 focus:outline-none focus:border-rose-500">
            <option value="all">전체 보기</option>
            <option value="ready">먹어도 되는 음식</option>
            <option value="waiting">대기 중인 음식</option>
          </select>
          <span id="total-count" class="text-xs text-slate-400 font-medium">총 0개</span>
        </div>
      </div>

      <!-- Food Card Container -->
      <div id="food-list" class="space-y-3">
        <!-- Dynamic content -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-12 px-4 bg-white border border-slate-200 border-dashed rounded-2xl shadow-sm">
        <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="utensils" class="w-6 h-6"></i>
        </div>
        <p class="text-slate-700 text-sm font-semibold">표시할 음식이 없습니다.</p>
        <p class="text-slate-400 text-xs mt-1">자주 먹으면 안 되는 음식과 권장 간격을 등록해 보세요!</p>
      </div>

    </section>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs py-2.5 px-4 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">메시지</span>
  </div>

  <script>
    const STORAGE_KEY = 'food_cooldown_simple_data';
    let foods = [];

    // App Initialization
    window.onload = function() {
      loadData();
      renderUI();
      lucide.createIcons();

      // Refresh status every 1 minute
      setInterval(() => {
        renderUI();
      }, 60000);
    };

    // LocalStorage Load (Empty array if no saved data)
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          foods = JSON.parse(saved);
        } else {
          foods = [];
        }
      } catch (e) {
        console.error('Failed to load data:', e);
        foods = [];
      }
    }

    // LocalStorage Auto-Save
    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    }

    // Form Submit (Add or Edit)
    function handleFormSubmit(e) {
      e.preventDefault();
      const editingId = document.getElementById('editing-id').value;
      const nameInput = document.getElementById('food-name');
      const cooldownInput = document.getElementById('cooldown-days');
      const categorySelect = document.getElementById('food-category');

      const name = nameInput.value.trim();
      const cooldownDays = parseInt(cooldownInput.value, 10);
      const category = categorySelect.value;

      if (!name || isNaN(cooldownDays) || cooldownDays < 1) return;

      if (editingId) {
        // Edit Mode
        const food = foods.find(f => f.id === editingId);
        if (food) {
          food.name = name;
          food.cooldownDays = cooldownDays;
          food.category = category;
          showToast(`'${name}' 정보가 수정되었습니다.`);
        }
      } else {
        // Create Mode
        const newFood = {
          id: 'food_' + Date.now(),
          name: name,
          category: category,
          cooldownDays: cooldownDays,
          lastEaten: null
        };
        foods.unshift(newFood);
        showToast(`'${name}'이(가) 추가되었습니다.`);
      }

      saveData();
      resetForm();
      renderUI();
    }

    // Start Editing
    function editFood(id) {
      const food = foods.find(f => f.id === id);
      if (!food) return;

      document.getElementById('editing-id').value = food.id;
      document.getElementById('food-name').value = food.name;
      document.getElementById('cooldown-days').value = food.cooldownDays;
      document.getElementById('food-category').value = food.category;

      document.getElementById('form-title').innerHTML = `<i data-lucide="edit-3" class="w-4 h-4 text-amber-500"></i> 음식 정보 수정`;
      document.getElementById('submit-btn-text').innerText = '수정 완료';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    // Reset Form
    function resetForm() {
      document.getElementById('editing-id').value = '';
      document.getElementById('food-name').value = '';
      document.getElementById('cooldown-days').value = '';
      document.getElementById('food-category').selectedIndex = 0;

      document.getElementById('form-title').innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4 text-rose-500"></i> 새 제한 음식 등록`;
      document.getElementById('submit-btn-text').innerText = '음식 목록에 추가하기';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      lucide.createIcons();
    }

    // Delete Food Item
    function deleteFood(id) {
      const food = foods.find(f => f.id === id);
      if (!food) return;

      foods = foods.filter(f => f.id !== id);
      saveData();
      renderUI();
      showToast(`'${food.name}'이(가) 삭제되었습니다.`);
    }

    // Log "Ate Today"
    function logEaten(id) {
      const food = foods.find(f => f.id === id);
      if (!food) return;

      food.lastEaten = new Date().toISOString();
      saveData();
      renderUI();
      showToast(`'${food.name}' 섭취 기록 완료! 쿨다운 시작`);
    }

    // Calculate Cooldown & D-Day status
    function getCooldownStatus(food) {
      if (!food.lastEaten) {
        return { isReady: true, dDay: 0, progressPct: 100, daysPassed: 0 };
      }

      const lastDate = new Date(food.lastEaten);
      const nextAvailableDate = new Date(lastDate.getTime() + food.cooldownDays * 86400000);
      const now = new Date();

      const diffMs = nextAvailableDate - now;
      const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

      const totalCooldownMs = food.cooldownDays * 86400000;
      const elapsedMs = now - lastDate;
      const progressPct = Math.min(100, Math.max(0, (elapsedMs / totalCooldownMs) * 100));
      const daysPassed = Math.floor(elapsedMs / (1000 * 60 * 60 * 24));

      return {
        isReady: diffMs <= 0,
        dDay: diffMs <= 0 ? 0 : diffDays,
        progressPct: progressPct,
        daysPassed: daysPassed
      };
    }

    // Render Cards & UI
    function renderUI() {
      const foodListEl = document.getElementById('food-list');
      const emptyStateEl = document.getElementById('empty-state');
      const totalCountEl = document.getElementById('total-count');
      const statWaitingEl = document.getElementById('stat-waiting');
      const statReadyEl = document.getElementById('stat-ready');
      const statusFilter = document.getElementById('status-filter')?.value || 'all';

      let waitingCount = 0;
      let readyCount = 0;

      // Count stats for all foods
      foods.forEach(food => {
        const status = getCooldownStatus(food);
        if (status.isReady) readyCount++;
        else waitingCount++;
      });

      // Filter foods according to select options
      const filteredFoods = foods.filter(food => {
        const status = getCooldownStatus(food);
        if (statusFilter === 'ready') return status.isReady;
        if (statusFilter === 'waiting') return !status.isReady;
        return true;
      });

      totalCountEl.innerText = `총 ${filteredFoods.length}개`;
      statWaitingEl.innerText = `${waitingCount}개`;
      statReadyEl.innerText = `${readyCount}개`;

      if (filteredFoods.length === 0) {
        foodListEl.innerHTML = '';
        emptyStateEl.classList.remove('hidden');
        return;
      }

      emptyStateEl.classList.add('hidden');

      foodListEl.innerHTML = filteredFoods.map(food => {
        const status = getCooldownStatus(food);

        const formattedLastEaten = food.lastEaten 
          ? new Date(food.lastEaten).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' })
          : '기록 없음';

        return `
          <div class="bg-white border ${status.isReady ? 'border-emerald-300 bg-gradient-to-r from-white to-emerald-50/20' : 'border-slate-200/90'} rounded-2xl p-4 shadow-sm hover:border-slate-300 transition-all">
            <!-- Card Header -->
            <div class="flex items-start justify-between">
              <div>
                <span class="text-[11px] font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md inline-block mb-1 border border-slate-200/60">
                  ${food.category}
                </span>
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                  ${food.name}
                </h3>
              </div>

              <!-- Cooldown Status Badge -->
              <div>
                ${status.isReady 
                  ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-200">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 먹어도 돼요!
                     </span>`
                  : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200">
                      <i data-lucide="clock" class="w-3.5 h-3.5"></i> D-${status.dDay} (${status.dDay}일 남음)
                     </span>`
                }
              </div>
            </div>

            <!-- Detail Info -->
            <div class="mt-3 text-xs text-slate-500 space-y-1">
              <div class="flex justify-between items-center">
                <span>권장 섭취 주기: <strong class="text-slate-700">${food.cooldownDays}일마다</strong></span>
                <span>마지막 섭취: <strong class="text-slate-700">${formattedLastEaten}</strong></span>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-3">
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200/60">
                <div 
                  class="h-full ${status.isReady ? 'bg-emerald-500' : 'bg-rose-500'} transition-all duration-500" 
                  style="width: ${status.progressPct}%"
                ></div>
              </div>
              <div class="flex justify-between text-[10px] text-slate-400 mt-1 font-medium">
                <span>섭취 완료</span>
                <span>${status.isReady ? '쿨다운 완료' : `${status.daysPassed}/${food.cooldownDays}일 경과`}</span>
              </div>
            </div>

            <!-- Card Actions -->
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <div class="flex items-center gap-1">
                <button 
                  onclick="editFood('${food.id}')" 
                  class="p-2 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-xl transition text-xs flex items-center gap-1"
                  title="수정"
                >
                  <i data-lucide="edit-2" class="w-4 h-4"></i>
                </button>
                <button 
                  onclick="deleteFood('${food.id}')" 
                  class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition text-xs flex items-center gap-1"
                  title="삭제"
                >
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>

              <button 
                onclick="logEaten('${food.id}')" 
                class="flex-1 py-2 px-3 ${status.isReady ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'} font-semibold text-xs rounded-xl shadow-sm transition duration-150 flex items-center justify-center gap-1.5 active:scale-[0.98]"
              >
                <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
                오늘 먹음 (기록)
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Helper Toast Notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = msg;

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }
  </script>
</body>
</html>
